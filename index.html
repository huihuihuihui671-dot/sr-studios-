<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR STUDIOS | Sarthak Raj</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <nav class="navbar">
        <div class="logo magnetic">SR STUDIOS.</div>
        <ul class="nav-links">
            <li><a href="#about" class="magnetic">About</a></li>
            <li><a href="#services" class="magnetic">Services</a></li>
            <li><a href="#portfolio" class="magnetic">Work</a></li>
            <li><a href="#discord" class="magnetic">Discord</a></li>
        </ul>
        <a href="#contact" class="btn primary magnetic">Hire Me</a>
    </nav>

    <section id="hero" class="hero">
        <img src="assets/icons/star.svg" class="floating-doodle star1" alt="star">
        <img src="assets/icons/heart.svg" class="floating-doodle heart1" alt="heart">
        <img src="assets/icons/scribble.svg" class="floating-doodle scribble1" alt="scribble">

        <div class="hero-content">
            <h1 class="hero-title">SR STUDIOS</h1>
            <p class="hero-subtitle">Designing visuals that stop the scroll and communities that never stop growing.</p>
            <div class="hero-buttons">
                <a href="#portfolio" class="btn primary magnetic">View Work</a>
                <a href="https://discord.gg/yourlink" target="_blank" class="btn secondary magnetic">Join Discord</a>
            </div>
        </div>
    </section>

    <section id="portfolio" class="portfolio">
        <h2 class="section-title">Selected Work</h2>
        
        <div class="portfolio-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="thumbnails">Thumbnails</button>
            <button class="filter-btn" data-filter="overlays">Overlays</button>
            <button class="filter-btn" data-filter="discord">Discord Projects</button>
        </div>

        <div class="portfolio-grid" id="portfolio-grid">
            </div>
    </section>

    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/portfolio.js"></script>
</body>
</html>
