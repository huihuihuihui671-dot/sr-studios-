<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR STUDIOS | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e6e2d6;
            --accent: #658345;
            --text: #1c1c1c;
            --card: #ffffff;
            --font-head: 'Oswald', sans-serif;
            --font-body: 'Inter', sans-serif;
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { background-color: var(--bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; position: relative; }
        a { text-decoration: none; color: inherit; }

        /* Custom Cursor */
        #cursor-dot { width: 8px; height: 8px; background: var(--text); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.1s; }
        #cursor-ring { width: 40px; height: 40px; border: 2px solid var(--accent); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s; }
        .hover-target:hover ~ #cursor-ring { width: 60px; height: 60px; background: rgba(101, 131, 69, 0.1); }

        /* Navigation */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 100;
            background-color: var(--bg);
            border-top: 3px solid var(--accent);
            border-bottom: 3px solid var(--accent);
            display: flex; align-items: stretch;
            height: 80px;
        }
        .nav-brand {
            padding: 0 30px; display: flex; flex-direction: column; justify-content: center;
            border-right: 2px dashed var(--accent);
        }
        .nav-brand h1 { font-family: var(--font-head); font-size: 2rem; line-height: 1.1; text-transform: uppercase; }
        .nav-brand span { font-size: 0.85rem; color: #555; }
        .nav-links { display: flex; flex: 1; align-items: stretch; }
        .nav-link {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-family: var(--font-head); font-size: 1.2rem; text-transform: uppercase;
            border-right: 2px dashed var(--accent); transition: var(--transition);
        }
        .nav-link:last-child { border-right: none; }
        .nav-link:hover { background: var(--accent); color: var(--bg); }
        .btn-collab {
            background: var(--text); color: var(--bg); padding: 0 30px; border: none;
            font-family: var(--font-head); font-size: 1.2rem; text-transform: uppercase;
            transition: var(--transition); pointer-events: auto;
        }
        .btn-collab:hover { background: var(--accent); }

        /* Container */
        .container { max-width: 1300px; margin: 0 auto; padding: 0 5%; position: relative; z-index: 10; }
        section { padding: 150px 0; position: relative; }

        /* Doodles */
        .doodle { position: absolute; z-index: 0; pointer-events: none; }
        .d-dashed { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
        .d-solid { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .d-fill { fill: var(--accent); }
        
        .hero-dashed-path { top: 20%; left: 0; width: 100%; height: 60%; }
        .hero-star-1 { top: 15%; left: 10%; width: 40px; animation: float 4s ease-in-out infinite; }
        .hero-star-2 { bottom: 20%; left: 15%; width: 30px; animation: float 5s ease-in-out infinite reverse; }
        .hero-heart { bottom: 15%; right: 30%; width: 40px; animation: float 4s ease-in-out infinite; }
        .hero-blob { bottom: -10%; right: -5%; width: 250px; opacity: 0.8; }
        .about-scribble { top: 0; right: 10%; width: 150px; }

        /* Hero */
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .hero-title-container { position: relative; display: inline-block; }
        .hero h2 { font-family: var(--font-head); font-size: clamp(6rem, 15vw, 16rem); line-height: 0.9; text-transform: uppercase; color: var(--text); z-index: 2; position: relative; letter-spacing: -2px; }
        .hero-avatar { position: absolute; top: -5%; right: -5%; width: clamp(80px, 12vw, 150px); height: clamp(80px, 12vw, 150px); background: var(--bg); border: 3px solid var(--accent); border-radius: 50%; padding: 10px; z-index: 3; animation: float 6s ease-in-out infinite; box-shadow: 10px 10px 0px rgba(101, 131, 69, 0.2); }

        /* About Section */
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
        .about-content h2 { font-family: var(--font-head); font-size: clamp(4rem, 8vw, 7rem); line-height: 1; margin-bottom: 30px; text-transform: uppercase; position: relative; }
        .about-content p { font-size: 1.3rem; line-height: 1.8; margin-bottom: 20px; font-weight: 600; white-space: pre-line; }
        
        .tools-title { font-family: var(--font-head); font-size: 2rem; text-transform: uppercase; margin-top: 30px; margin-bottom: 15px; }
        .tools-grid { display: flex; gap: 15px; }
        .tool-icon { width: 70px; height: 70px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 1.5rem; transition: transform 0.3s; box-shadow: 4px 4px 0px rgba(0,0,0,0.1); }
        .tool-icon:hover { transform: translateY(-5px); }

        /* Animated Avatar Area */
        .about-avatar-wrapper { position: relative; display: flex; justify-content: center; align-items: center; }
        .main-avatar { width: 100%; max-width: 450px; animation: float 5s ease-in-out infinite; position: relative; z-index: 5; filter: drop-shadow(0px 20px 20px rgba(0,0,0,0.1)); }
        
        .floating-badge { position: absolute; background: var(--accent); color: var(--bg); padding: 8px 16px; border-radius: 30px; font-weight: 800; font-size: 0.9rem; z-index: 6; display: flex; align-items: center; gap: 8px; box-shadow: 4px 4px 0px rgba(0,0,0,0.2); animation: float 4s ease-in-out infinite; }
        .floating-badge::after { content: ''; position: absolute; width: 0; height: 0; border-style: solid; }
        .badge-1 { top: 20%; left: 0; transform: rotate(-5deg); animation-delay: 0.5s; }
        .badge-1::after { border-width: 8px 0 8px 12px; border-color: transparent transparent transparent var(--accent); right: -10px; top: 50%; transform: translateY(-50%); }
        .badge-2 { bottom: 30%; right: -5%; transform: rotate(5deg); animation-delay: 1s; }
        .badge-2::after { border-width: 8px 12px 8px 0; border-color: transparent var(--accent) transparent transparent; left: -10px; top: 50%; transform: translateY(-50%); }

        /* Portfolio */
        .section-title { font-family: var(--font-head); font-size: 4rem; text-align: center; text-transform: uppercase; margin-bottom: 50px; }
        .filters { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
        .filter-btn { padding: 10px 25px; background: transparent; border: 2px solid var(--text); border-radius: 50px; font-weight: 800; text-transform: uppercase; transition: var(--transition); }
        .filter-btn.active, .filter-btn:hover { background: var(--text); color: var(--bg); }
        
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        .portfolio-item { border-radius: 20px; overflow: hidden; border: 4px solid var(--text); box-shadow: 8px 8px 0px var(--text); transition: var(--transition); background: var(--card); }
        .portfolio-item:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0px var(--accent); }
        .portfolio-item img { width: 100%; height: 250px; object-fit: cover; border-bottom: 4px solid var(--text); }
        .portfolio-info { padding: 20px; }
        .portfolio-info h3 { font-family: var(--font-head); font-size: 1.5rem; text-transform: uppercase; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 10001; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; pointer-events: auto; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--bg); padding: 50px; border-radius: 24px; border: 4px solid var(--text); width: 90%; max-width: 500px; position: relative; transform: translateY(50px); transition: transform 0.4s; box-shadow: 15px 15px 0px var(--accent); }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .close-btn { position: absolute; top: 20px; right: 25px; font-size: 2rem; background: none; border: none; font-weight: bold; color: var(--text); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-family: var(--font-head); font-size: 1.2rem; margin-bottom: 8px; text-transform: uppercase; }
        .form-group input, .form-group textarea { width: 100%; padding: 15px; border: 2px solid var(--text); border-radius: 12px; background: var(--card); font-family: var(--font-body); font-size: 1rem; outline: none; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .submit-btn { width: 100%; padding: 15px; background: var(--text); color: var(--bg); border: none; border-radius: 12px; font-family: var(--font-head); font-size: 1.5rem; text-transform: uppercase; transition: background 0.3s; }
        .submit-btn:hover { background: var(--accent); }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        @media(max-width: 900px) {
            .nav-brand { padding: 0 15px; border: none; }
            .nav-links { display: none; }
            .about-grid { grid-template-columns: 1fr; }
            .hero h2 { font-size: 4rem; }
            #cursor-dot, #cursor-ring { display: none; }
            * { cursor: auto !important; }
        }
    </style>
</head>
<body>
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <nav>
        <div class="nav-brand hover-target">
            <h1 id="nav-name">SR STUDIOS</h1>
            <span id="nav-subtitle">Thumbnail Designer</span>
        </div>
        <div class="nav-links">
            <a href="#hero" class="nav-link hover-target">Home</a>
            <a href="#about" class="nav-link hover-target">About</a>
            <a href="#portfolio" class="nav-link hover-target">Works</a>
        </div>
        <button class="btn-collab hover-target" onclick="openModal()">Collab / Hire</button>
    </nav>

    <!-- Global Doodles -->
    <svg class="doodle hero-dashed-path" viewBox="0 0 1000 500" preserveAspectRatio="none">
        <path class="d-dashed" d="M0,250 C200,400 300,100 500,250 C700,400 800,100 1000,250"/>
    </svg>
    <svg class="doodle hero-star-1" viewBox="0 0 50 50"><path class="d-solid" d="M25,0 L32,18 L50,25 L32,32 L25,50 L18,32 L0,25 L18,18 Z"/></svg>
    <svg class="doodle hero-star-2" viewBox="0 0 50 50"><path class="d-solid" d="M25,0 L32,18 L50,25 L32,32 L25,50 L18,32 L0,25 L18,18 Z"/></svg>
    <svg class="doodle hero-heart" viewBox="0 0 50 50"><path class="d-solid" d="M25,45 C25,45 5,30 5,15 C5,5 20,5 25,15 C30,5 45,5 45,15 C45,30 25,45 25,45 Z"/></svg>

    <section class="hero hover-target" id="hero">
        <div class="container" style="text-align: center;">
            <div class="hero-title-container">
                <h2 id="hero-title">PORTFOLIO</h2>
                <img src="" id="hero-avatar" class="hero-avatar" alt="Mini Avatar">
            </div>
        </div>
    </section>

    <section id="about" class="container hover-target">
        <svg class="doodle about-scribble" viewBox="0 0 100 100"><path class="d-solid" d="M10,50 Q30,10 50,50 T90,50 Q70,90 50,50 T10,50"/></svg>
        
        <div class="about-grid">
            <div class="about-content">
                <h2 id="about-title">ABOUT ME</h2>
                <p id="about-bio"></p>
                <div class="tools-title" id="about-tools-title">TOOLS I USE-</div>
                <div class="tools-grid" id="about-tools"></div>
            </div>
            
            <div class="about-avatar-wrapper">
                <img src="" id="main-avatar" class="main-avatar" alt="Character Avatar">
                <div class="floating-badge badge-1" id="badge-1">GRAPHIC DESIGNER</div>
                <div class="floating-badge badge-2" id="badge-2">YOUTUBE</div>
            </div>
        </div>
    </section>

    <section id="portfolio" class="container">
        <h2 class="section-title">SELECTED WORKS</h2>
        <div class="filters" id="portfolio-filters">
            <button class="filter-btn active hover-target" data-filter="all">All</button>
            <button class="filter-btn hover-target" data-filter="Gaming">Gaming</button>
            <button class="filter-btn hover-target" data-filter="Documentary">Documentary</button>
        </div>
        <div class="portfolio-grid" id="portfolio-grid"></div>
    </section>

    <!-- Collab Modal Form -->
    <div class="modal-overlay" id="collab-modal">
        <div class="modal-content">
            <button class="close-btn hover-target" onclick="closeModal()">&times;</button>
            <h2 style="font-family: var(--font-head); font-size: 3rem; margin-bottom: 5px; text-transform: uppercase; line-height: 1;">Let's Work</h2>
            <p style="margin-bottom: 25px; font-weight: 600; opacity: 0.7;">Fill out the details below.</p>
            
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="client-name" class="hover-target" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Discord / Email</label>
                <input type="text" id="client-contact" class="hover-target" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Project Details</label>
                <textarea id="client-details" class="hover-target" placeholder="I need 5 thumbnails for..."></textarea>
            </div>
            <button class="submit-btn hover-target" onclick="submitProject()">Submit Request</button>
        </div>
    </div>

    <script>
        const DATA_KEY = 'sr_studios_data';
        let siteData = {};

        async function loadData() {
            const localData = localStorage.getItem(DATA_KEY);
            if (localData) {
                siteData = JSON.parse(localData);
                renderWebsite();
            } else {
                try {
                    const res = await fetch('data.json');
                    if(res.ok) {
                        siteData = await res.json();
                        if(!siteData.tasks) siteData.tasks = [];
                        localStorage.setItem(DATA_KEY, JSON.stringify(siteData));
                        renderWebsite();
                    } else throw new Error("Fetch failed");
                } catch (e) {
                    console.log("Using fallback data");
                }
            }
        }

        function renderWebsite() {
            // Theme
            if(siteData.theme) {
                document.documentElement.style.setProperty('--bg', siteData.theme.backgroundColor);
                document.documentElement.style.setProperty('--accent', siteData.theme.accentColor);
                document.documentElement.style.setProperty('--text', siteData.theme.textColor);
            }
            
            // Nav & Hero
            document.getElementById('nav-name').textContent = siteData.hero.name;
            document.getElementById('nav-subtitle').textContent = siteData.hero.subtitle;
            document.getElementById('hero-title').textContent = siteData.hero.title;
            document.getElementById('hero-avatar').src = siteData.hero.avatar;

            // About
            document.getElementById('about-title').textContent = siteData.about.title;
            document.getElementById('about-bio').textContent = siteData.about.bio;
            document.getElementById('about-tools-title').textContent = siteData.about.toolsTitle;
            document.getElementById('main-avatar').src = siteData.about.avatar;
            document.getElementById('badge-1').textContent = siteData.about.labels[0];
            document.getElementById('badge-2').textContent = siteData.about.labels[1];

            document.getElementById('about-tools').innerHTML = siteData.about.tools.map(t => 
                `<div class="tool-icon hover-target" style="background-color: ${t.color}">${t.name}</div>`
            ).join('');
            
            renderPortfolio('all');
        }

        function renderPortfolio(filter) {
            const grid = document.getElementById('portfolio-grid');
            const items = filter === 'all' ? siteData.portfolio : siteData.portfolio.filter(p => p.category === filter);
            grid.innerHTML = items.map(item => `
                <div class="portfolio-item hover-target">
                    <img src="${item.image}" alt="${item.title}">
                    <div class="portfolio-info">
                        <h3>${item.title}</h3>
                        <p style="color:var(--accent); font-weight:800; margin-top:5px;">${item.category}</p>
                    </div>
                </div>
            `).join('');
        }

        // --- Interaction & Form Logic ---
        function openModal() { document.getElementById('collab-modal').classList.add('active'); }
        function closeModal() { document.getElementById('collab-modal').classList.remove('active'); }

        function submitProject() {
            const name = document.getElementById('client-name').value.trim();
            const contact = document.getElementById('client-contact').value.trim();
            const details = document.getElementById('client-details').value.trim();

            if(!name || !contact || !details) return alert("Please fill all fields.");

            const newTask = {
                id: Date.now(),
                name: name,
                contact: contact,
                details: details,
                status: 'Pending Inquiry',
                date: new Date().toLocaleDateString()
            };

            let currentData = JSON.parse(localStorage.getItem(DATA_KEY)) || siteData;
            if(!currentData.tasks) currentData.tasks = [];
            currentData.tasks.push(newTask);
            
            localStorage.setItem(DATA_KEY, JSON.stringify(currentData));
            
            alert("Sent successfully! It's now on the Admin Dashboard.");
            closeModal();
            
            document.getElementById('client-name').value = '';
            document.getElementById('client-contact').value = '';
            document.getElementById('client-details').value = '';
        }

        // Custom Cursor
        const cursorDot = document.getElementById('cursor-dot'), cursorRing = document.getElementById('cursor-ring');
        let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; cursorDot.style.transform = `translate(${mouseX}px, ${mouseY}px)`; });
        function animateCursor() { ringX += (mouseX - ringX) * 0.15; ringY += (mouseY - ringY) * 0.15; cursorRing.style.transform = `translate(${ringX}px, ${ringY}px)`; requestAnimationFrame(animateCursor); }
        animateCursor();

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderPortfolio(e.target.dataset.filter);
            });
        });

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
