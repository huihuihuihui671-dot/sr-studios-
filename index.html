<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR STUDIOS | Sarthak Raj</title>
    <style>
        /* Base & Theme */
        :root {
            --bg: #e6e4dc; 
            --accent: #617a44; 
            --text: #1a1a1a; 
            --card: #ffffff;
            --font-main: 'Segoe UI', system-ui, sans-serif;
            --font-display: 'Impact', 'Arial Black', sans-serif;
            --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { background-color: var(--bg); color: var(--text); font-family: var(--font-main); overflow-x: hidden; position: relative; }
        a { text-decoration: none; color: inherit; }
        
        /* Custom Cursor */
        #cursor-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.1s; }
        #cursor-ring { width: 40px; height: 40px; border: 2px solid var(--text); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: all 0.15s ease-out; }
        .hover-target:hover ~ #cursor-ring { width: 60px; height: 60px; background: rgba(97, 122, 68, 0.1); border-color: var(--accent); }

        /* Loader */
        #loader { position: fixed; inset: 0; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; z-index: 10000; transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1); }
        .loader-text { font-family: var(--font-display); font-size: 4rem; letter-spacing: 2px; animation: pulse 1.5s infinite; color: var(--text); }
        
        /* Doodles & Background Elements */
        .doodle-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .d-path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 8 8; }
        .d-solid-path { fill: none; stroke: var(--text); stroke-width: 3; stroke-linecap: round; }
        .d-star { fill: var(--accent); }
        .d-heart { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
        .d-dot { fill: var(--accent); }
        .float-anim { animation: floatDoodle 6s ease-in-out infinite; }
        .float-anim-alt { animation: floatDoodleAlt 7s ease-in-out infinite reverse; }

        @keyframes floatDoodle { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(5deg); } }
        @keyframes floatDoodleAlt { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(15px) rotate(-5deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.95); } }

        /* Layout & Typography */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 5%; position: relative; z-index: 1; }
        section { padding: 120px 0; position: relative; }
        
        h1 { font-family: var(--font-display); font-size: clamp(5rem, 15vw, 12rem); font-weight: normal; line-height: 0.9; text-transform: uppercase; margin-bottom: 10px; color: var(--text); letter-spacing: -2px; }
        h2 { font-family: var(--font-display); font-size: clamp(3rem, 6vw, 5rem); font-weight: normal; margin-bottom: 30px; text-transform: uppercase; position: relative; display: inline-block; letter-spacing: -1px; }
        .doodle-highlight { position: absolute; bottom: 5px; right: -20px; width: 60px; height: 60px; background: var(--accent); z-index: -1; transform: rotate(-10deg); opacity: 0.8; }
        
        p { font-size: 1.3rem; line-height: 1.6; color: #333; font-weight: 500; }

        /* Navbar */
        nav { position: fixed; top: 20px; left: 5%; right: 5%; border: 2px solid var(--accent); display: flex; align-items: stretch; z-index: 100; background: var(--bg); color: var(--text); font-family: var(--font-display); text-transform: uppercase; box-shadow: 4px 4px 0 rgba(0,0,0,0.05); }
        .logo-box { padding: 15px 30px; display: flex; flex-direction: column; justify-content: center; }
        .logo { font-size: 2rem; letter-spacing: 1px; line-height: 1; }
        .logo-sub { font-family: var(--font-main); font-size: 0.8rem; font-weight: bold; opacity: 0.7; text-transform: none; }
        
        .nav-links { display: flex; flex: 1; }
        .nav-item { flex: 1; display: flex; justify-content: center; align-items: center; border-left: 2px dashed var(--accent); font-size: 1.2rem; transition: background 0.3s; letter-spacing: 1px;}
        .nav-item:hover { background: rgba(97, 122, 68, 0.1); }
        .nav-item span { border-bottom: 2px solid var(--text); padding-bottom: 2px; }

        .btn-collab { background: var(--accent); color: #fff; padding: 0 30px; border: none; border-left: 2px dashed var(--accent); font-family: var(--font-display); font-size: 1.2rem; text-transform: uppercase; transition: all 0.3s ease; pointer-events: auto; }
        .btn-collab:hover { background: var(--text); color: var(--bg); }

        /* Hero */
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding-top: 100px; }
        .hero-content { position: relative; }
        
        /* About Section Redesign */
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        .about-text p { margin-bottom: 20px; white-space: pre-line; }
        .tools-title { font-family: var(--font-display); font-size: 2rem; text-transform: uppercase; margin: 30px 0 15px; }
        .roles { display: flex; gap: 15px; flex-wrap: wrap; }
        .role-pill { padding: 15px 25px; border-radius: 12px; font-weight: 800; font-size: 1.2rem; color: #fff; text-transform: uppercase; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); }
        
        /* Tool Colors (mocking the image) */
        .role-pill:nth-child(1) { background: #00a8e1; } /* Ps blue */
        .role-pill:nth-child(2) { background: #0054a6; } /* Ae blue */
        .role-pill:nth-child(3) { background: #330072; } /* Pr purple */
        .role-pill:nth-child(4) { background: #9900ff; }

        /* Avatar Container */
        .avatar-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; display: flex; justify-content: center; }
        .animated-avatar { width: 100%; height: auto; object-fit: contain; animation: floatAvatar 4s ease-in-out infinite; filter: drop-shadow(10px 10px 0px rgba(0,0,0,0.1)); }
        
        @keyframes floatAvatar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        .floating-badge { position: absolute; background: var(--accent); color: #fff; font-weight: bold; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; z-index: 10; animation: floatDoodle 5s infinite; }
        .floating-badge::after { content: ''; position: absolute; width: 0; height: 0; border-style: solid; }
        .badge-1 { top: 20%; left: -5%; }
        .badge-1::after { border-width: 10px 0 10px 15px; border-color: transparent transparent transparent var(--accent); right: -10px; top: 50%; transform: translateY(-50%); }
        .badge-2 { top: 40%; right: -5%; animation-delay: 1s; }
        .badge-2::after { border-width: 10px 15px 10px 0; border-color: transparent var(--accent) transparent transparent; left: -10px; top: 50%; transform: translateY(-50%); }

        /* Animations */
        .reveal { opacity: 0; transform: translateY(50px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* Services & Portfolio */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .service-card { background: transparent; padding: 40px; border: 3px solid var(--text); border-radius: 20px; box-shadow: 8px 8px 0px var(--accent); transition: var(--transition); }
        .service-card:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0px var(--text); }
        .service-card h3 { font-family: var(--font-display); font-size: 2rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
        
        .filters { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 40px; }
        .filter-btn { padding: 10px 25px; background: transparent; border: 2px solid var(--text); border-radius: 50px; font-weight: bold; font-size: 1.1rem; transition: var(--transition); text-transform: uppercase;}
        .filter-btn.active, .filter-btn:hover { background: var(--text); color: var(--bg); box-shadow: 4px 4px 0 var(--accent); transform: translate(-2px, -2px);}
        
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        .portfolio-item { position: relative; border-radius: 20px; overflow: hidden; border: 3px solid var(--text); box-shadow: 6px 6px 0 var(--text); transition: transform 0.3s ease; }
        .portfolio-item img { width: 100%; height: 250px; object-fit: cover; transition: transform 0.6s ease; display: block; }
        .portfolio-info { position: absolute; bottom: -100%; left: 0; width: 100%; padding: 20px; background: rgba(26,26,26,0.9); color: #fff; transition: bottom 0.4s ease; pointer-events: none; border-top: 3px solid var(--accent);}
        .portfolio-item:hover { transform: translate(-4px, -4px); box-shadow: 10px 10px 0 var(--accent); }
        .portfolio-item:hover img { transform: scale(1.05); filter: grayscale(20%); }
        .portfolio-item:hover .portfolio-info { bottom: 0; }

        /* Footer & Social Icons */
        footer { padding: 80px 0; text-align: center; position: relative; overflow: hidden;}
        .social-links { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .social-icon-box { background: var(--text); padding: 15px; border-radius: 15px; display: flex; justify-content: center; align-items: center; transition: var(--transition); box-shadow: 4px 4px 0 var(--accent); }
        .social-icon { width: 30px; height: 30px; fill: var(--bg); }
        .social-icon-box:hover { transform: translate(-3px, -3px); box-shadow: 7px 7px 0 var(--accent); background: var(--accent); }

        /* Modal popup */
        .modal-overlay { position: fixed; inset: 0; background: rgba(230, 228, 220, 0.8); backdrop-filter: blur(5px); z-index: 10001; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; pointer-events: auto; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--bg); padding: 50px; border-radius: 20px; width: 90%; max-width: 500px; position: relative; transform: translateY(50px); transition: transform 0.4s; box-shadow: 15px 15px 0 var(--accent); border: 4px solid var(--text); }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 2rem; background: none; border: none; font-weight: bold; color: var(--text); transition: color 0.2s; font-family: var(--font-display);}
        .close-btn:hover { color: var(--accent); }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; font-size: 0.9rem;}
        .form-group input, .form-group textarea { width: 100%; padding: 15px; border: 3px solid var(--text); border-radius: 12px; background: var(--card); color: var(--text); font-family: inherit; font-size: 1rem; outline: none; transition: box-shadow 0.2s;}
        .form-group input:focus, .form-group textarea:focus { box-shadow: 4px 4px 0 var(--accent); }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .submit-btn { width: 100%; padding: 15px; background: var(--accent); color: #fff; border: 3px solid var(--text); border-radius: 12px; font-size: 1.2rem; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; cursor: none; box-shadow: 4px 4px 0 var(--text);}
        .submit-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--text); }

        @media(max-width: 900px) { 
            h1 { font-size: 4rem; } 
            .nav-links { display: none; } 
            .about-grid { grid-template-columns: 1fr; }
            .btn-collab { padding: 0 20px; }
            #cursor-dot, #cursor-ring { display: none; } 
            * { cursor: auto !important; } 
        }
    </style>
</head>

            discord: `<svg class="social-icon" viewBox="0 0 24 24"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/></svg>`,
            youtube: `<svg class="social-icon" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`,

        };

        async function loadData() {
            const localData = localStorage.getItem(DATA_KEY);
            if (localData) {
                siteData = JSON.parse(localData);
                renderWebsite();
            } else {
                try {
                    const res = await fetch('data.json');
                    if(res.ok) {
                        siteData = await res.json();
                        if(!siteData.tasks) siteData.tasks = [];
                        localStorage.setItem(DATA_KEY, JSON.stringify(siteData));
                        renderWebsite();
                    } else throw new Error("Fetch failed");
                } catch (e) {
                    // Fallback to ensure it functions
                    siteData = { theme: {backgroundColor: "#e6e4dc", accentColor: "#617a44", textColor: "#1a1a1a"}, hero: { title: "PORTFOLIO", name: "Sarthak Raj", roles: ["Graphic Designer"], description: "Premium aesthetics." }, about: { bio: "Creative designer.", tools: ["Ps"], avatar: "https://placehold.co/400x500/617a44/fff?text=Avatar" }, services: [], portfolio: [], social: { discord: "sarthakraj", email: "hello@srstudios.com" }, tasks: [] };
                    renderWebsite();
                }
            }
        }

        function renderWebsite() {
            if(siteData.theme) {
                document.documentElement.style.setProperty('--bg', siteData.theme.backgroundColor);
                document.documentElement.style.setProperty('--accent', siteData.theme.accentColor);
                document.documentElement.style.setProperty('--text', siteData.theme.textColor);
            }
            
            document.getElementById('nav-name').textContent = siteData.hero.name || 'Graphic Designer';
            document.getElementById('hero-title').textContent = siteData.hero.title;
            document.getElementById('hero-desc').textContent = siteData.hero.description;
            
            document.getElementById('about-bio').textContent = siteData.about.bio;
            document.getElementById('about-avatar').src = siteData.about.avatar || "https://placehold.co/400x500/617a44/fff?text=Avatar";
            
            document.getElementById('about-tools').innerHTML = siteData.about.tools.map(t => `<div class="role-pill hover-target">${t}</div>`).join('');
            document.getElementById('services-grid').innerHTML = siteData.services.map(s => `<div class="service-card hover-target"><h3>${s.title}</h3><p>${s.desc}</p></div>`).join('');
            
            renderPortfolio('all');

            const socContainer = document.getElementById('social-links');
            socContainer.innerHTML = `
                ${siteData.social.instagram ? `<a href="${siteData.social.instagram}" target="_blank" class="hover-target"><div class="social-icon-box">${icons.instagram}</div></a>` : ''}
                ${siteData.social.youtube ? `<a href="${siteData.social.youtube}" target="_blank" class="hover-target"><div class="social-icon-box">${icons.youtube}</div></a>` : ''}
                <a href="mailto:${siteData.social.email}" class="hover-target"><div class="social-icon-box">${icons.email}</div></a>
                <a href="#" class="hover-target" onclick="alert('Discord ID: ${siteData.social.discord}')"><div class="social-icon-box">${icons.discord}</div></a>
            `;

            setTimeout(initAnimations, 100);
        }

        function renderPortfolio(filter) {
            const grid = document.getElementById('portfolio-grid');
            const items = filter === 'all' ? siteData.portfolio : siteData.portfolio.filter(p => p.category === filter);
            grid.innerHTML = items.map(item => `
                <div class="portfolio-item hover-target">
                    <img src="${item.image}" alt="${item.title}">
                    <div class="portfolio-info">
                        <h3 style="font-family:var(--font-display); font-size:1.8rem; letter-spacing:1px; text-transform:uppercase;">${item.title}</h3>
                        <p style="color:var(--accent); font-weight:800; text-transform:uppercase;">${item.category}</p>
                    </div>
                </div>
            `).join('');
        }

        // --- Interaction & Form Logic ---
        function openModal() { document.getElementById('collab-modal').classList.add('active'); }
        function closeModal() { document.getElementById('collab-modal').classList.remove('active'); }

        function submitProject() {
            const name = document.getElementById('client-name').value.trim();
            const contact = document.getElementById('client-contact').value.trim();
            const details = document.getElementById('client-details').value.trim();

            if(!name || !contact || !details) return alert("Please fill all details so I can understand your project!");

            const newTask = {
                id: Date.now(),
                name: name,
                contact: contact,
                details: details,
                status: 'Pending Inquiry',
                date: new Date().toLocaleDateString()
            };

            let currentData = JSON.parse(localStorage.getItem(DATA_KEY)) || siteData;
            if(!currentData.tasks) currentData.tasks = [];
            currentData.tasks.push(newTask);
            
            localStorage.setItem(DATA_KEY, JSON.stringify(currentData));
            
            alert("Project details submitted successfully! Sarthak will reach out to you soon.");
            closeModal();
            
            document.getElementById('client-name').value = '';
            document.getElementById('client-contact').value = '';
            document.getElementById('client-details').value = '';
        }

        function initAnimations() {
            setTimeout(() => document.getElementById('loader').style.transform = 'translateY(-100%)', 800);
            const observer = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); }), { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        // Custom Cursor
        const cursorDot = document.getElementById('cursor-dot'), cursorRing = document.getElementById('cursor-ring');
        let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; cursorDot.style.transform = `translate(${mouseX}px, ${mouseY}px)`; });
        function animateCursor() { ringX += (mouseX - ringX) * 0.15; ringY += (mouseY - ringY) * 0.15; cursorRing.style.transform = `translate(${ringX}px, ${ringY}px)`; requestAnimationFrame(animateCursor); }
        animateCursor();

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderPortfolio(e.target.dataset.filter);
            });
        });

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
