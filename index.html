<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR STUDIOS | Sarthak Raj</title>
    <meta name="description" content="Portfolio of Sarthak Raj - Graphic Designer, Thumbnail Designer, and Discord Developer.">
    <style>
        /* Base & Theme */
        :root {
            --bg: #fcfaf5;
            --accent: #6b8e23;
            --text: #111111;
            --card: #ffffff;
            --font-main: 'Segoe UI', system-ui, sans-serif;
            --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { background-color: var(--bg); color: var(--text); font-family: var(--font-main); overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        
        /* Custom Cursor */
        #cursor-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.1s; }
        #cursor-ring { width: 40px; height: 40px; border: 1px solid var(--text); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: all 0.15s ease-out; }
        .hover-target:hover ~ #cursor-ring { width: 60px; height: 60px; background: rgba(107, 142, 35, 0.1); border-color: var(--accent); }

        /* Loader */
        #loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10000; transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1); }
        .loader-text { font-size: 3rem; font-weight: 800; letter-spacing: 5px; animation: pulse 1.5s infinite; }
        
        /* Doodles */
        .doodle { position: absolute; pointer-events: none; opacity: 0.6; z-index: 0; }
        .d1 { top: 15%; left: 10%; animation: float 6s ease-in-out infinite; }
        .d2 { top: 40%; right: 15%; animation: float 8s ease-in-out infinite reverse; }
        .d3 { bottom: 20%; left: 20%; animation: float 7s ease-in-out infinite; }
        
        /* Layout & Typography */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 5%; position: relative; z-index: 1; }
        section { padding: 120px 0; position: relative; }
        h1 { font-size: clamp(4rem, 8vw, 8rem); font-weight: 900; line-height: 1; text-transform: uppercase; margin-bottom: 20px; }
        h2 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; margin-bottom: 40px; position: relative; display: inline-block; }
        h2::after { content: ''; position: absolute; bottom: 0; left: 0; width: 50%; height: 4px; background: var(--accent); border-radius: 2px; }
        p { font-size: 1.2rem; line-height: 1.6; opacity: 0.8; }

        /* Navbar */
        nav { position: fixed; top: 0; width: 100%; padding: 30px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 100; mix-blend-mode: difference; color: #fff; }
        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: 2px; }
        
        /* Hero */
        .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 100px; }
        .roles { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .role-pill { padding: 10px 20px; border: 1px solid var(--text); border-radius: 50px; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; }
        
        /* Animations */
        .reveal { opacity: 0; transform: translateY(50px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-20px) rotate(10deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Services */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .service-card { background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: var(--transition); border: 1px solid rgba(0,0,0,0.05); }
        .service-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); border-color: var(--accent); }
        .service-card h3 { font-size: 1.5rem; margin-bottom: 15px; }

        /* Portfolio */
        .filters { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 40px; }
        .filter-btn { padding: 10px 25px; border: none; background: transparent; border: 1px solid var(--text); border-radius: 50px; font-weight: 600; transition: var(--transition); }
        .filter-btn.active, .filter-btn:hover { background: var(--text); color: var(--bg); }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        .portfolio-item { position: relative; border-radius: 20px; overflow: hidden; transform-style: preserve-3d; transform: perspective(1000px); }
        .portfolio-item img { width: 100%; height: 250px; object-fit: cover; transition: transform 0.6s ease; display: block; }
        .portfolio-info { position: absolute; bottom: -100%; left: 0; width: 100%; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); color: #fff; transition: bottom 0.4s ease; }
        .portfolio-item:hover img { transform: scale(1.1); }
        .portfolio-item:hover .portfolio-info { bottom: 0; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; text-align: center; }
        .stat-item h4 { font-size: 4rem; color: var(--accent); font-weight: 900; }
        
        /* Footer */
        footer { padding: 60px 0; text-align: center; border-top: 1px solid rgba(0,0,0,0.1); }
        .social-links { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
        .social-links a { font-weight: bold; text-transform: uppercase; transition: color 0.3s; }
        .social-links a:hover { color: var(--accent); }

        @media(max-width: 768px) {
            h1 { font-size: 3rem; }
            section { padding: 80px 0; }
            .portfolio-grid { grid-template-columns: 1fr; }
            #cursor-dot, #cursor-ring { display: none; }
            * { cursor: auto; }
        }
    </style>
</head>
<body>
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <div id="loader">
        <div class="loader-text">SR STUDIOS</div>
    </div>

    <nav>
        <div class="logo">SR.</div>
        <div>Sarthak Raj</div>
    </nav>

    <svg class="doodle d1" width="100" height="100" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2"><path d="M50 10 C 20 40, 80 60, 50 90" stroke-linecap="round"/><circle cx="50" cy="50" r="40" stroke-dasharray="10 10"/></svg>
    <svg class="doodle d2" width="80" height="80" viewBox="0 0 100 100" fill="none" stroke="var(--accent)" stroke-width="3"><polygon points="50,10 61,39 92,39 67,58 76,89 50,70 24,89 33,58 8,39 39,39"/></svg>

    <section class="hero hover-target" id="hero">
        <div class="container">
            <h1 class="reveal" id="hero-title">Loading...</h1>
            <p class="reveal" id="hero-desc" style="max-width: 600px; font-size: 1.5rem;"></p>
            <div class="roles reveal" id="hero-roles"></div>
        </div>
    </section>

    <section id="about" class="container reveal hover-target">
        <h2>About Sarthak</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px;">
            <p id="about-bio"></p>
            <div>
                <h3>Toolkit</h3>
                <div class="roles" id="about-tools" style="margin-top:15px;"></div>
            </div>
        </div>
    </section>

    <section id="services" class="container reveal">
        <h2>Expertise</h2>
        <div class="services-grid" id="services-grid"></div>
    </section>

    <section id="portfolio" class="container reveal">
        <h2>Selected Works</h2>
        <div class="filters" id="portfolio-filters">
            <button class="filter-btn active hover-target" data-filter="all">All</button>
            <button class="filter-btn hover-target" data-filter="Gaming">Gaming</button>
            <button class="filter-btn hover-target" data-filter="BGMI">BGMI</button>
            <button class="filter-btn hover-target" data-filter="Tech">Tech</button>
            <button class="filter-btn hover-target" data-filter="Documentary">Documentary</button>
            <button class="filter-btn hover-target" data-filter="AI">AI</button>
            <button class="filter-btn hover-target" data-filter="YouTube">YouTube</button>
        </div>
        <div class="portfolio-grid" id="portfolio-grid"></div>
    </section>

    <section id="stats" class="container reveal">
        <div class="stats-grid" id="stats-grid"></div>
    </section>

    <footer class="hover-target">
        <div class="container reveal">
            <h2>Let's Collaborate</h2>
            <p>Ready to elevate your visual identity?</p>
            <div class="social-links" id="social-links"></div>
            <p style="margin-top: 40px; font-size: 0.9rem; opacity: 0.5;">© 2026 SR Studios. Built dynamically.</p>
        </div>
    </footer>

    <script>
        // Data Management - Future Ready Architecture
        const DATA_KEY = 'sr_studios_data';
        let siteData = {};

        async function loadData() {
            // Priority: localStorage > data.json
            const localData = localStorage.getItem(DATA_KEY);
            if (localData) {
                siteData = JSON.parse(localData);
                renderWebsite();
            } else {
                try {
                    const res = await fetch('data.json');
                    if(res.ok) {
                        siteData = await res.json();
                        localStorage.setItem(DATA_KEY, JSON.stringify(siteData));
                        renderWebsite();
                    } else throw new Error("Fetch failed");
                } catch (e) {
                    console.log("Using fallback dummy data due to local file restrictions.");
                    // Fallback to ensure it works even without a server
                    siteData = {
                        "theme": {"backgroundColor": "#fcfaf5", "accentColor": "#6b8e23", "textColor": "#111111"},
                        "hero": { "title": "SR STUDIOS", "roles": ["Designer", "Dev"], "description": "Premium aesthetics." },
                        "about": { "bio": "Creative designer from the UK.", "tools": ["PS", "AE"] },
                        "services": [{ "title": "Thumbnails", "desc": "High CTR" }],
                        "portfolio": [
                            { "id":1, "title":"Doma Live Stream", "category":"BGMI", "image":"https://placehold.co/800x450/111/fff?text=Doma+Live" },
                            { "id":2, "title":"Rani Priya Wedding", "category":"Documentary", "image":"https://placehold.co/800x450/111/fff?text=Wedding" }
                        ],
                        "stats": [{ "label":"Projects", "value":"150+" }],
                        "social": { "discord": "sarthakraj7269357", "email": "hello@srstudios.com" }
                    };
                    renderWebsite();
                }
            }
        }

        function applyTheme() {
            if(siteData.theme) {
                document.documentElement.style.setProperty('--bg', siteData.theme.backgroundColor);
                document.documentElement.style.setProperty('--accent', siteData.theme.accentColor);
                document.documentElement.style.setProperty('--text', siteData.theme.textColor);
            }
        }

        function renderWebsite() {
            applyTheme();
            
            // Hero
            document.getElementById('hero-title').textContent = siteData.hero.title;
            document.getElementById('hero-desc').textContent = siteData.hero.description;
            const rolesContainer = document.getElementById('hero-roles');
            rolesContainer.innerHTML = '';
            siteData.hero.roles.forEach(role => {
                rolesContainer.innerHTML += `<div class="role-pill">${role}</div>`;
            });

            // About
            document.getElementById('about-bio').textContent = siteData.about.bio;
            const toolsContainer = document.getElementById('about-tools');
            toolsContainer.innerHTML = '';
            siteData.about.tools.forEach(tool => {
                toolsContainer.innerHTML += `<div class="role-pill">${tool}</div>`;
            });

            // Services
            const srvGrid = document.getElementById('services-grid');
            srvGrid.innerHTML = '';
            siteData.services.forEach(srv => {
                srvGrid.innerHTML += `<div class="service-card hover-target"><h3>${srv.title}</h3><p>${srv.desc}</p></div>`;
            });

            // Portfolio
            renderPortfolio('all');

            // Stats
            const statsGrid = document.getElementById('stats-grid');
            statsGrid.innerHTML = '';
            siteData.stats.forEach(stat => {
                statsGrid.innerHTML += `<div class="stat-item"><h4>${stat.value}</h4><p>${stat.label}</p></div>`;
            });

            // Socials
            const socContainer = document.getElementById('social-links');
            socContainer.innerHTML = `
                ${siteData.social.instagram ? `<a href="${siteData.social.instagram}" target="_blank" class="hover-target">Instagram</a>` : ''}
                ${siteData.social.youtube ? `<a href="${siteData.social.youtube}" target="_blank" class="hover-target">YouTube</a>` : ''}
                <a href="mailto:${siteData.social.email}" class="hover-target">Email</a>
                <a href="#" class="hover-target">Discord: ${siteData.social.discord}</a>
            `;

            // Trigger animations
            setTimeout(initAnimations, 100);
        }

        function renderPortfolio(filter) {
            const grid = document.getElementById('portfolio-grid');
            grid.innerHTML = '';
            const items = filter === 'all' ? siteData.portfolio : siteData.portfolio.filter(p => p.category === filter);
            
            items.forEach(item => {
                grid.innerHTML += `
                    <div class="portfolio-item hover-target" data-category="${item.category}">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="portfolio-info">
                            <h3 style="font-size:1.5rem">${item.title}</h3>
                            <p style="color:var(--accent); font-weight:bold">${item.category}</p>
                        </div>
                    </div>
                `;
            });

            // Re-bind 3D tilt
            bind3DTilt();
        }

        // Interactivity & Animations
        function initAnimations() {
            // Remove Loader
            setTimeout(() => {
                document.getElementById('loader').style.transform = 'translateY(-100%)';
            }, 800);

            // Scroll Reveal
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        // Custom Cursor
        const cursorDot = document.getElementById('cursor-dot');
        const cursorRing = document.getElementById('cursor-ring');
        let mouseX = 0, mouseY = 0;
        let ringX = 0, ringY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorDot.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
        });

        function animateCursor() {
            ringX += (mouseX - ringX) * 0.15;
            ringY += (mouseY - ringY) * 0.15;
            cursorRing.style.transform = `translate(${ringX}px, ${ringY}px)`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // 3D Tilt Effect on Portfolio Cards
        function bind3DTilt() {
            document.querySelectorAll('.portfolio-item').forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -10;
                    const rotateY = ((x - centerX) / centerX) * 10;
                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                });
            });
        }

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderPortfolio(e.target.dataset.filter);
            });
        });

        // Init
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
